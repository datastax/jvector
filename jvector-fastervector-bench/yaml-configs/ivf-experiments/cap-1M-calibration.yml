yamlSchemaVersion: 1

# Calibration sweep for the per-dataset IVF configs: how recall@10 and QPS move with nlist,
# storageFactor and nprobe on real embeddings. Recall doesn't depend on the machine, so this runs
# once (on the high-end machine) and its results set the dataset files for every machine.
#
#   java ... io.github.jbellis.jvector.fastervector.bench.BenchIvfYAML \
#       jvector-fastervector-bench/yaml-configs/ivf-experiments/cap-1M-calibration.yml
#
# 4 builds (nlist x storageFactor) x 7 nprobe values = 28 rows, each with batched and per-query
# throughput, latency and recall. topK 10 only, matching the graph's cap-1M regression config.
dataset: cap-1M

construction:
  nlist: [1024, 4096]         # ~sqrt(N) and ~4 sqrt(N) for 1M vectors
  storageFactor: [1.0, 2.0]   # 32x and 16x compression
  buildThreads: 0             # all CPUs; override with -Divf.buildThreads
  ssdPaths: [ivf_cache]       # override with -Divf.ssdPaths
  useSavedIndexIfExists: Yes  # reruns reuse the 4 indexes and only repeat the searches

search:
  topKNprobe:
    10: [4, 8, 16, 32, 64, 128, 256]
  searchThreads: [48]         # all vCPUs on the high-end machine; override with -Divf.searchThreads
