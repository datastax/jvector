# Meson cross-compilation file for building libjvector for x86_64 on an aarch64 host.
#
# Prerequisites (Ubuntu/Debian):
#   sudo apt-get install -y gcc-x86-64-linux-gnu g++-x86-64-linux-gnu
#
# The cross file is passed to meson via:
#   meson setup --cross-file <path>/x86_64-cross.ini ...

[binaries]
c       = 'x86_64-linux-gnu-gcc'
cpp     = 'x86_64-linux-gnu-g++'
ar      = 'x86_64-linux-gnu-ar'
strip   = 'x86_64-linux-gnu-strip'
pkg-config = ['x86_64-linux-gnu-pkg-config']

[host_machine]
system     = 'linux'
cpu_family = 'x86_64'
cpu        = 'x86_64'
endian     = 'little'
