# Meson cross-compilation file for building libjvector for aarch64 on an x86_64 host.
#
# Prerequisites (Ubuntu/Debian):
#   sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
#
# The cross file is passed to meson via:
#   meson setup --cross-file <path>/aarch64-cross.ini ...

[binaries]
c       = 'aarch64-linux-gnu-gcc'
cpp     = 'aarch64-linux-gnu-g++'
ar      = 'aarch64-linux-gnu-ar'
strip   = 'aarch64-linux-gnu-strip'
# pkg-config wrapper that searches the sysroot; fall back to plain pkg-config
# if the multiarch wrapper is not installed.
pkg-config = ['aarch64-linux-gnu-pkg-config']

[host_machine]
system     = 'linux'
cpu_family = 'aarch64'
cpu        = 'aarch64'
endian     = 'little'
