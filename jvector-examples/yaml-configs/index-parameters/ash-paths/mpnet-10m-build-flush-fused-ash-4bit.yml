# MPNet 10M at 16X nominal compression. Build the graph with source FP32 vectors,
# then write fused 4-bit ASH traversal codes and NVQ reranking vectors to disk.
yamlSchemaVersion: 3
onDiskIndexVersion: 7
dataset: mpnet-10m

construction:
  type: onDisk
  writerMode: sequential
  outDegree: [32]
  efConstruction: [100]
  neighborOverflow: [1.2f]
  addHierarchy: [Yes]
  refineFinalGraph: [Yes]
  fusedGraph: [Yes]
  compression:
    - type: None
  reranking:
    type: NVQ
  useSavedIndexIfExists: No

search:
  topKOverquery:
    10: [1.0, 2.0]
  useSearchPruning: [No]
  compression:
    - type: ASH
      parameters:
        encodedBits: 1576
        optimizer: ITQ
        landmarkCount: 1
        bitsPerDimension: 4
        queryProjection: fp16
        queryExecution: queued
        maxBatchSize: 8
