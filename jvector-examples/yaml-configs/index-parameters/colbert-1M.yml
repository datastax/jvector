yamlSchemaVersion: 3
onDiskIndexVersion: 7

dataset: colbert-1M
useDatasetPrefetching: false

construction:
  type: onDisk
  outDegree: [32]
  efConstruction: [100]
  neighborOverflow: [1.2f]
  addHierarchy: [Yes]
  refineFinalGraph: [Yes]
  fusedGraph: [No]
  compression:
    - type: None
  reranking:
    type: None
  useSavedIndexIfExists: No

search:
  topKOverquery:
    10: [1.0, 2.0, 5.0, 10.0]
    100: [1.0, 2.0]
  useSearchPruning: [No]
  compression:
    - type: None
