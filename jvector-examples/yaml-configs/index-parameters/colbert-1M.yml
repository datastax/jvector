yamlSchemaVersion: 2
onDiskIndexVersion: 7

dataset: colbert-1M

construction:
  outDegree: [32]
  efConstruction: [100]
  neighborOverflow: [1.2f]
  addHierarchy: [No]
  refineFinalGraph: [Yes]
  fusedGraph: [No]
  compression:
    - type: None
# To use ASH, comment out None in both sections.
#    - type: ASH
#      parameters:
#        compressionRatio: 16
#        optimizer: ITQ
#        landmarkCount: 1
#        bitsPerDimension: 2
# To use PQ, comment out None in both sections.
#    - type: PQ
#      parameters:
#        mFactor: 4
#        k: 256
#        anisotropicThreshold: -1.0
  reranking:
    - NVQ
  useSavedIndexIfExists: No

search:
  topKOverquery:
    10: [1.0, 2.0, 5.0, 10.0]
    100: [1.0, 2.0]
  useSearchPruning: [No]
  compression:
    - type: None
# To use ASH, comment out None in both sections.
#    - type: ASH
#      parameters:
#        compressionRatio: 16
#        optimizer: ITQ
#        landmarkCount: 1
#        bitsPerDimension: 2
# To use PQ, comment out None in both sections.
#    - type: PQ
#      parameters:
#        mFactor: 4
#        k: 256
#        anisotropicThreshold: -1.0
