# gecko-100k: fused 2-bit ASH graph with NVQ reranking. This example shows how to
# train ASH with a random rotation instead of ITQ.
yamlSchemaVersion: 3
onDiskIndexVersion: 7

dataset: gecko-100k

construction:
  type: onDisk
  outDegree: [32]
  efConstruction: [100]
  neighborOverflow: [1.2f]
  addHierarchy: [Yes]
  refineFinalGraph: [Yes]
  fusedGraph: [Yes]
  compression:
    - type: ASH
      parameters:
        compressionRatio: 32
        optimizer: RANDOM
        landmarkCount: 1
        bitsPerDimension: 2
  reranking:
    type: NVQ
  useSavedIndexIfExists: No

search:
  topKOverquery:
    10: [1.0, 2.0]
  useSearchPruning: [No]
  compression:
    - type: ASH
      parameters:
        compressionRatio: 32
        optimizer: RANDOM
        landmarkCount: 1
        bitsPerDimension: 2
