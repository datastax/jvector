yamlSchemaVersion: 2
onDiskIndexVersion: 7

dataset: gecko-100k

construction:
  outDegree: [64]
  efConstruction: [200]
  neighborOverflow: [1.2f]
  addHierarchy: [Yes]
  refineFinalGraph: [Yes]
  fusedGraph: [Yes]
  compression:
    - type: ASH
      parameters:
        compressionRatio: 32
        optimizer: ITQ
        landmarkCount: 1
        bitsPerDimension: 2
# To use PQ, comment out ASH and uncomment PQ in both sections.
#    - type: PQ
#      parameters:
#        mFactor: 8
#        k: 256
#        anisotropicThreshold: -1.0
  reranking:
    - NVQ
  useSavedIndexIfExists: No # If yes, the system will attempt to locate a cached copy of the index instead of constructing

search:
  topKOverquery:
    10: [1.0, 2.0, 5.0, 10.0]
#    100: [1.0, 2.0]
  useSearchPruning: [No]
  compression:
    - type: ASH
      parameters:
        compressionRatio: 32
        optimizer: ITQ
        landmarkCount: 1
        bitsPerDimension: 2
# To use PQ, comment out ASH and uncomment PQ in both sections.
#    - type: PQ
#      parameters:
#        mFactor: 8
#        k: 256
#        anisotropicThreshold: -1.0
