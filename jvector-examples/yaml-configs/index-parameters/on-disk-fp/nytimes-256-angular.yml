# nytimes-256-angular (256 dimensions, angular similarity): on-disk graph built and searched with full-precision vectors.
yamlSchemaVersion: 3
onDiskIndexVersion: 7

dataset: nytimes-256-angular

construction:
  type: onDisk
  outDegree: [32]
  efConstruction: [100]
  neighborOverflow: [1.2f]
  addHierarchy: [Yes]
  refineFinalGraph: [Yes]
  fusedGraph: [No]
  compression:
    - type: None
  reranking:
    type: None
  useSavedIndexIfExists: No

search:
  topKOverquery:
    10: [1.0, 2.0]
    100: [1.0, 2.0]
  useSearchPruning: [No]
  compression:
    - type: None
