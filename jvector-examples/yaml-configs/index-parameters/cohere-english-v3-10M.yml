yamlSchemaVersion: 2
onDiskIndexVersion: 7

dataset: cohere-english-v3-10M

construction:
  outDegree: [32]
  efConstruction: [100]
  neighborOverflow: [1.2f]
  addHierarchy: [Yes]
  refineFinalGraph: [Yes]
  fusedGraph: [Yes]
  compression:
    - type: ASH
      parameters:
        compressionRatio: 32
        optimizer: ITQ
        landmarkCount: 1
        bitsPerDimension: 2
# To use PQ, comment out ASH and uncomment PQ in both sections.
#    - type: PQ
#      parameters:
#        mFactor: 8
#        k: 256
#        anisotropicThreshold: -1.0
  reranking:
    - NVQ
  useSavedIndexIfExists: No

search:
  topKOverquery:
    10: [1.0]
  useSearchPruning: [No]
  compression:
    - type: ASH
      parameters:
        compressionRatio: 32
        optimizer: ITQ
        landmarkCount: 1
        bitsPerDimension: 2
# To use PQ, comment out ASH and uncomment PQ in both sections.
#    - type: PQ
#      parameters:
#        mFactor: 8
#        k: 256
#        anisotropicThreshold: -1.0
