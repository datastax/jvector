# Signed int8 vectors stored inline and scored exactly; int8 supports no compression or reranking.
yamlSchemaVersion: 3
onDiskIndexVersion: 7

dataset: wiki-multilingual-v3-int8-1m

construction:
  type: onDisk
  outDegree: [32]
  efConstruction: [100]
  neighborOverflow: [1.2f]
  addHierarchy: [No]
  refineFinalGraph: [No]
  fusedGraph: [No]
  compression:
    - type: None
  reranking:
    type: None
  useSavedIndexIfExists: No

search:
  topKOverquery:
    10: [1.0]
    100: [1.0]
  useSearchPruning: [Yes]
  compression:
    - type: None
