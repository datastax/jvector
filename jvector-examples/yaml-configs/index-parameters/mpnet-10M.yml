# MPNet-10M: ASH(b=2,d=384), nominal 32x compression.
# Fused graph scoring, NVQ reranking, and saved model/index reuse.
yamlSchemaVersion: 3
onDiskIndexVersion: 7
dataset: mpnet-10m

construction:
  type: onDisk
  outDegree: [32]
  efConstruction: [100]
  neighborOverflow: [1.2f]
  addHierarchy: [Yes]
  refineFinalGraph: [Yes]
  fusedGraph: [Yes]
  compression:
    - type: ASH
      parameters:
        encodedBits: 808
        optimizer: ITQ
        landmarkCount: 1
        bitsPerDimension: 2
  reranking:
    type: NVQ
  # A fresh case directory measures training/encoding/construction. Later JVMs
  # in that directory reuse exactly the same model and index for querying.
  useSavedIndexIfExists: Yes

search:
  topKOverquery:
    10: [1.0, 2.0]
  useSearchPruning: [No]
  compression:
    - type: ASH
      parameters:
        encodedBits: 808
        optimizer: ITQ
        landmarkCount: 1
        bitsPerDimension: 2
