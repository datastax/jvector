# cohere-english-v3-10M: 1024 input dimensions, 133 code bytes per vector.
# The 2-bit label describes the ASH budget; PQ uses 133 8-bit subspaces.
# ASH uses C=1 and D/2 projected dimensions, including its five-byte header.
# One JVM per experiment: build with every physical core, then query the same index
# with 1 and 8 search workers. The settings otherwise match studies/ash-vs-pq.
yamlSchemaVersion: 3
onDiskIndexVersion: 7
dataset: cohere-english-v3-10M

construction:
  type: onDisk
  writerMode: parallel
  workers: max
  outDegree: [32]
  efConstruction: [100]
  neighborOverflow: [1.2f]
  addHierarchy: [Yes]
  refineFinalGraph: [Yes]
  fusedGraph: [Yes]
  compression:
    - type: ASH
      parameters:
        encodedBits: 1064
        optimizer: ITQ
        landmarkCount: 1
        bitsPerDimension: 2
  reranking:
    type: NVQ
  # One JVM builds and queries, so nothing needs to be saved for later JVMs.
  useSavedIndexIfExists: No

search:
  topKOverquery:
    10: [1.0, 2.0]
  useSearchPruning: [No]
  queryExecution: queued
  workers: [1, 8]
  compression:
    - type: ASH
      parameters:
        queryProjection: auto
        maxBatchSize: 8
        encodedBits: 1064
        optimizer: ITQ
        landmarkCount: 1
        bitsPerDimension: 2
