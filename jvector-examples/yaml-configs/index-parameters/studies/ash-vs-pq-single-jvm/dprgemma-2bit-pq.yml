# dpr-gemma-1m: 768 input dimensions, 101 code bytes per vector.
# The 2-bit label describes the ASH budget; PQ uses 101 8-bit subspaces.
# ASH uses C=1 and D/2 projected dimensions, including its five-byte header.
# One JVM: run with benchyaml-play.sh; see docs/ash-pq-benchmark.md. It builds with every
# physical core, then runs one search case on the same index (8 search workers,
# overquery 1), so every query is new to the JVM. The index settings match
# studies/ash-vs-pq.
yamlSchemaVersion: 3
onDiskIndexVersion: 8
dataset: dpr-gemma-1m

construction:
  type: onDisk
  writerMode: parallel
  workers: max
  outDegree: [32]
  efConstruction: [100]
  neighborOverflow: [1.2f]
  addHierarchy: [Yes]
  refineFinalGraph: [Yes]
  fusedGraph: [Yes]
  compression:
    - type: PQ
      parameters:
        m: 101
        k: 256
        centerData: "No"
        anisotropicThreshold: -1.0
  reranking:
    type: NVQ
  # One JVM builds and queries, so nothing needs to be saved for later JVMs.
  useSavedIndexIfExists: No

search:
  topKOverquery:
    10: [1.0]
  useSearchPruning: [No]
  workers: [8]
  compression:
    - type: PQ
      parameters:
        m: 101
        k: 256
        centerData: "No"
        anisotropicThreshold: -1.0
