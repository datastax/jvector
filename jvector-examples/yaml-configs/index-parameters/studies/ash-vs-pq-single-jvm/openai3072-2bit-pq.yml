# openai-3072-1m: 3072 input dimensions, 389 code bytes per vector.
# The 2-bit label describes the ASH budget; PQ uses 389 8-bit subspaces.
# ASH uses C=1 and D/2 projected dimensions, including its five-byte header.
# One JVM per experiment: build with every physical core, then query the same index
# with 1 and 8 search workers. The settings otherwise match studies/ash-vs-pq.
yamlSchemaVersion: 3
onDiskIndexVersion: 7
dataset: openai-3072-1m

construction:
  type: onDisk
  writerMode: parallel
  workers: max
  outDegree: [32]
  efConstruction: [100]
  neighborOverflow: [1.2f]
  addHierarchy: [Yes]
  refineFinalGraph: [Yes]
  fusedGraph: [Yes]
  compression:
    - type: PQ
      parameters:
        m: 389
        k: 256
        centerData: "No"
        anisotropicThreshold: -1.0
  reranking:
    type: NVQ
  # One JVM builds and queries, so nothing needs to be saved for later JVMs.
  useSavedIndexIfExists: No

search:
  topKOverquery:
    10: [1.0, 2.0]
  useSearchPruning: [No]
  workers: [1, 8]
  compression:
    - type: PQ
      parameters:
        m: 389
        k: 256
        centerData: "No"
        anisotropicThreshold: -1.0
