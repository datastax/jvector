# cohere-english-v3-1M: 1024 input dimensions, 133 code bytes per vector.
# The 2-bit label describes the ASH budget; PQ uses 133 8-bit subspaces.
# ASH uses C=1 and D/2 projected dimensions, including its five-byte header.
# Separate JVMs: run with run-ash-pq-study.py or run-ash-pq-benchmark.sh; see docs/ash-pq-benchmark.md.
yamlSchemaVersion: 3
onDiskIndexVersion: 7
dataset: cohere-english-v3-1M

construction:
  type: onDisk
  writerMode: parallel
  outDegree: [32]
  efConstruction: [100]
  neighborOverflow: [1.2f]
  addHierarchy: [Yes]
  refineFinalGraph: [Yes]
  fusedGraph: [Yes]
  compression:
    - type: PQ
      parameters:
        m: 133
        k: 256
        centerData: "No"
        anisotropicThreshold: -1.0
  reranking:
    type: NVQ
  # A fresh case directory measures training/encoding/construction. Later JVMs
  # in that directory reuse exactly the same model and index for querying.
  useSavedIndexIfExists: Yes

search:
  topKOverquery:
    10: [1.0, 2.0]
  useSearchPruning: [No]
  compression:
    - type: PQ
      parameters:
        m: 133
        k: 256
        centerData: "No"
        anisotropicThreshold: -1.0
