# mpnet-1m: 768 input dimensions, 101 code bytes per vector.
# The 2-bit label describes the ASH budget; PQ uses 101 8-bit subspaces.
# ASH uses C=1 and D/2 projected dimensions, including its five-byte header.
# See docs/ash-pq-benchmark.md for construction, direct and queued run commands.
yamlSchemaVersion: 3
onDiskIndexVersion: 7
dataset: mpnet-1m

construction:
  type: onDisk
  writerMode: parallel
  outDegree: [32]
  efConstruction: [100]
  neighborOverflow: [1.2f]
  addHierarchy: [Yes]
  refineFinalGraph: [Yes]
  fusedGraph: [Yes]
  compression:
    - type: ASH
      parameters:
        encodedBits: 808
        optimizer: ITQ
        landmarkCount: 1
        bitsPerDimension: 2
  reranking:
    type: NVQ
  # A fresh case directory measures training/encoding/construction. Later JVMs
  # in that directory reuse exactly the same model and index for querying.
  useSavedIndexIfExists: Yes

search:
  topKOverquery:
    10: [1.0, 2.0]
  useSearchPruning: [No]
  compression:
    - type: ASH
      parameters:
        queryProjection: auto
        queryExecution: queued
        maxBatchSize: 8
        encodedBits: 808
        optimizer: ITQ
        landmarkCount: 1
        bitsPerDimension: 2
