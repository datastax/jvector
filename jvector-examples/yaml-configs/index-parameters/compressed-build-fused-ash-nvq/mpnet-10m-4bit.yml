# MPNet 10M at 16X nominal compression. Build with symmetric 4-bit ASH scoring
# and write fused ASH traversal codes and NVQ reranking vectors in parallel.
yamlSchemaVersion: 3
onDiskIndexVersion: 7
dataset: mpnet-10m

construction:
  type: onDisk
  writerMode: parallel
  outDegree: [32]
  efConstruction: [100]
  neighborOverflow: [1.2f]
  addHierarchy: [Yes]
  refineFinalGraph: [Yes]
  fusedGraph: [Yes]
  compression:
    - type: ASH
      scoring: symmetric
      parameters:
        encodedBits: 1576
        optimizer: ITQ
        landmarkCount: 1
        bitsPerDimension: 4
  reranking:
    type: NVQ
  useSavedIndexIfExists: No

search:
  topKOverquery:
    10: [1.0, 2.0]
  useSearchPruning: [No]
  queryExecution: queued
  compression:
    - type: ASH
      parameters:
        encodedBits: 1576
        optimizer: ITQ
        landmarkCount: 1
        bitsPerDimension: 4
        queryProjection: fp16
        maxBatchSize: 8
