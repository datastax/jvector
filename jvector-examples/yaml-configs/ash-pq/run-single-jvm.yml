# One JVM per experiment: construction, then one search case.
# Used by standalone BenchYAML via -Djvector.bench.runConfig=<this file>.
# Measured as in the separate-JVM study (warm index, cold queries): the index stays in the
# page cache, the JVM warms up on base vectors until JIT compilation settles, then each
# held-out query runs once in a single timed pass. Give the index YAML one search case
# (one search.workers value and one overquery): a later case in the same JVM would repeat
# queries that earlier passes already ran, so its queries would not be cold.
yamlSchemaVersion: 1
onDiskIndexVersion: 7
benchmarks:
  throughput: [AVG]
  accuracy: [recall]
  count: [visited]
measurement:
  evictIndex: false
  throughput:
    warmup: base
    untilCompiled: true
    passes: 1
    minSeconds: 0
console:
  benchmarks:
    throughput: [AVG]
    accuracy: [recall]
    count: [visited]
  metrics:
    execution: [response_mean_ms, response_p50_ms, response_p99_ms, response_p999_ms, page_reads_per_query, mean_batch_size]
logging:
  dir: logging
  runId: ash-pq-single-jvm-{ts}
  type: csv
  benchmarks:
    throughput: [AVG]
    accuracy: [recall]
    count: [visited]
  metrics:
    construction: [index_build_time_s, graph_build_time_s, flush_time_s, reopen_time_s, index_quant_time_s, search_quant_time_s]
    execution: [response_mean_ms, response_p50_ms, response_p99_ms, response_p999_ms, page_reads_per_query, mean_batch_size]
