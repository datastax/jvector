# Used by standalone BenchYAML via -Djvector.bench.runConfig=<this file>.
# Warm index, cold queries: the index stays in the page cache, the JVM warms up on
# base vectors until JIT compilation settles, then each held-out query runs once.
# Throughput runs first, so its single timed pass is the cold measurement; recall
# and visit counts come from later passes in the same JVM. One search case per JVM.
yamlSchemaVersion: 1
onDiskIndexVersion: 7
benchmarks:
  throughput: [AVG]
  accuracy: [recall]
  count: [visited]
measurement:
  evictIndex: false
  throughput:
    warmup: base
    untilCompiled: true
    passes: 1
    minSeconds: 0
console:
  benchmarks:
    throughput: [AVG]
    accuracy: [recall]
    count: [visited]
  metrics:
    construction: [index_build_time_s, index_quant_time_s, search_quant_time_s]
    execution: [response_mean_ms, response_p50_ms, response_p99_ms, response_p999_ms, page_reads_per_query, mean_batch_size]
logging:
  dir: logging
  runId: ash-pq-queued-{ts}
  type: csv
  benchmarks:
    throughput: [AVG]
    accuracy: [recall]
    count: [visited]
  metrics:
    construction: [index_build_time_s, index_quant_time_s, search_quant_time_s]
    execution: [response_mean_ms, response_p50_ms, response_p99_ms, response_p999_ms, page_reads_per_query, mean_batch_size]
