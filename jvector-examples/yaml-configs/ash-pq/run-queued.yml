# Used by standalone BenchYAML via -Djvector.bench.runConfig=<this file>.
yamlSchemaVersion: 1
onDiskIndexVersion: 7
# Optional ASH precision; omission preserves JVM settings and the auto default.
# ash:
#   queryProjection: int8  # auto, fp16, fp32, int8; explicit -D overrides YAML
queryExecution:
  mode: queued
benchmarks:
  throughput: [AVG]
  latency: [AVG, STD, P999]
  accuracy: [recall]
  count: [visited]
console:
  benchmarks:
    throughput: [AVG]
    latency: [AVG, STD, P999]
    accuracy: [recall]
    count: [visited]
  metrics:
    construction: [index_build_time_s, index_quant_time_s, search_quant_time_s]
    execution: [response_mean_ms, response_p95_ms, response_p99_ms, mean_batch_size]
logging:
  dir: logging
  jvectorRef: ash-dev
  runId: ash-pq-queued-{ts}
  type: csv
  benchmarks:
    throughput: [AVG]
    latency: [AVG, STD, P999]
    accuracy: [recall]
    count: [visited]
  metrics:
    construction: [index_build_time_s, index_quant_time_s, search_quant_time_s]
    execution: [response_mean_ms, response_p95_ms, response_p99_ms, mean_batch_size]
