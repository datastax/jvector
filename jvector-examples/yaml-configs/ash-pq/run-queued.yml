# Used by standalone BenchYAML via -Djvector.bench.runConfig=<this file>.
yamlSchemaVersion: 1
onDiskIndexVersion: 7
benchmarks:
  throughput: [AVG]
  latency: [AVG, STD, P999]
  accuracy: [recall]
  count: [visited]
measurement:
  throughput:
    minSeconds: 3.0   # Each timed pass repeats the queries for at least 3 s.
console:
  benchmarks:
    throughput: [AVG]
    latency: [AVG, STD, P999]
    accuracy: [recall]
    count: [visited]
  metrics:
    construction: [index_build_time_s, index_quant_time_s, search_quant_time_s]
    execution: [response_mean_ms, response_p95_ms, response_p99_ms, mean_batch_size]
logging:
  dir: logging
  runId: ash-pq-queued-{ts}
  type: csv
  benchmarks:
    throughput: [AVG]
    latency: [AVG, STD, P999]
    accuracy: [recall]
    count: [visited]
  metrics:
    construction: [index_build_time_s, index_quant_time_s, search_quant_time_s]
    execution: [response_mean_ms, response_p95_ms, response_p99_ms, mean_batch_size]
